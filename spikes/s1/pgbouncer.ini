; Spike S1 reference pooler configuration.
; Session pooling with the same pool size as the Rust proxy's backend connections,
; so the comparison isolates the I/O framework rather than pooling behaviour.
[databases]
pgbench = host=pg port=5432 dbname=pgbench

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 2000
default_pool_size = 100
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
admin_users = postgres
