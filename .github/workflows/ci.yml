name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep builds reproducible and avoid surprise MSRV breakage.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # The conformance matrix needs real servers and real client drivers, so it lives in
  # its own job. It runs against direct PostgreSQL first: if the harness cannot pass
  # against a correct server, its results against the proxy mean nothing.
  conformance:
    name: protocol conformance (control: direct postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Control run against direct PostgreSQL 18
        run: ./tests/conformance/run.sh

      # M0: the same 17 scenarios, but every one of them through pgproxy. This is the
      # first job that proves the proxy serves real sessions rather than just speaking
      # the protocol in unit tests.
      - name: End-to-end through pgproxy
        run: PROXY=1 ./tests/conformance/run.sh

      # The central design claim, demonstrated rather than asserted: the client
      # authenticates *to the backend* through the proxy, on a real SCRAM challenge, with
      # no credential in the proxy's config. The run also asserts a wrong password is
      # still rejected, so "all green" cannot mean "auth was bypassed".
      - name: SCRAM passthrough (proxy holds no credential)
        run: PG_AUTH=scram-sha-256 PROXY=1 ./tests/conformance/run.sh

      # Proves a real driver (libpq via psycopg) accepts the handshake our server
      # actually emits, including the AuthenticationOk / ParameterStatus /
      # BackendKeyData / ReadyForQuery sequence. The unit tests only prove we agree
      # with RFC 7677.
      - name: SCRAM-SHA-256 interop against a real driver
        run: ./tests/conformance/scram_interop.sh

  # NOTE: `cargo-fuzz` requires a nightly toolchain and is not yet wired up.
  # Phase 0 gate G5 remains open — see docs/plans/spike-findings.md.
