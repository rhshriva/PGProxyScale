workers = 2
[general.session]
query_timeout_secs = 3
[[databases]]
name = "policy_rls"
host = "127.0.0.1"
port = 55439
dbname = "conformance"
user = "postgres"
pool_mode = "transaction"
client_auth = "scram-sha256"
pool_size = 2
require_primary = true
auth_users = { postgres = "SCRAM-SHA-256$4096:cGdwcm94eS10ZXN0LXNhbHQ=$bnjU9GCMHxxI3hDk0aVJDUeTKPSt4QiWNyBMZTvsAyQ=:kCVRr5z13WVeARjoFmm9DsfXmHiNS/d4xgbRjwP+Py8=", other = "SCRAM-SHA-256$4096:cGdwcm94eS10ZXN0LXNhbHQ=$bnjU9GCMHxxI3hDk0aVJDUeTKPSt4QiWNyBMZTvsAyQ=:kCVRr5z13WVeARjoFmm9DsfXmHiNS/d4xgbRjwP+Py8=" }
[databases.policy]
