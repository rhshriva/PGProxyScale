[package]
name = "pgproxy-wire"
description = "PostgreSQL wire protocol codec and connection state machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pgproxy-parser = { path = "../pgproxy-parser" }
