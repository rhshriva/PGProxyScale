[package]
name = "pgproxy-wire"
description = "PostgreSQL wire protocol codec and connection state machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pgproxy-policy = { path = "../pgproxy-policy" }
pgproxy-admin = { path = "../pgproxy-admin" }
pgproxy-parser = { path = "../pgproxy-parser" }
pgproxy-pool = { path = "../pgproxy-pool" }
thiserror.workspace = true
tracing.workspace = true

# Authentication cryptography. These are RustCrypto crates, chosen over a single
# monolithic TLS/crypto stack because we need exactly these primitives and want them
# independently auditable.
sha2.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
md-5.workspace = true
base64.workspace = true
subtle.workspace = true
rand.workspace = true
stringprep = "0.1"

mio = { version = "1", features = ["net", "os-poll"] }
pgproxy-session = { path = "../pgproxy-session" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.18"

[dev-dependencies]
rcgen = "0.13"
