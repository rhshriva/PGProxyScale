[package]
name = "pgproxy-core"
description = "Runtime bootstrap, configuration and supervision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
pgproxy-parser = { path = "../pgproxy-parser" }
pgproxy-policy = { path = "../pgproxy-policy" }
pgproxy-admin = { path = "../pgproxy-admin" }
pgproxy-pool = { path = "../pgproxy-pool" }
pgproxy-wire = { path = "../pgproxy-wire" }

socket2.workspace = true
# Readiness notification with a *safe* registration API and a safe cross-thread waker.
# Chosen over `polling` precisely because `polling::Poller::add` is `unsafe`, and this
# crate is `#![forbid(unsafe_code)]` by ADR-0001.
mio = { version = "1", features = ["net", "os-poll"] }
signal-hook = "0.3"
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.30", features = ["signal", "process"] }
